icon: https://agents.cryptofolio.it/icon.png
startCommand:
  type: stdio
  command: npx
  args:
    - -y
    - agentwork-mcp
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'agentwork-mcp'],
      env: {
        MARKETPLACE_API_URL: config?.apiUrl || 'https://agents.cryptofolio.it'
      }
    })
configSchema:
  type: object
  properties:
    apiUrl:
      type: string
      description: "Autonomous AI Agent Marketplace API endpoint"
      default: "https://agents.cryptofolio.it"
